name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      image: ${{ steps.version.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
    steps:
      - name: Validate version
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[a-zA-Z0-9]+([.-][a-zA-Z0-9]+)*)?$ ]] || { echo 'Expected vMAJOR.MINOR.PATCH or a prerelease'; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then echo 'prerelease=true'; else echo 'prerelease=false'; fi >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
      - name: Validate tagged version
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: node -e 'if (require("./package.json").version !== process.env.TAG.slice(1)) throw new Error("Tag must match package.json version")'
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        if: env.DOCKERHUB_TOKEN != '' && env.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: |
            ${{ steps.version.outputs.image }}
            name=${{ env.DOCKERHUB_USERNAME }}/kafka-browser,enable=${{ env.DOCKERHUB_TOKEN != '' && env.DOCKERHUB_USERNAME != '' }}
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=raw,value=latest,enable=${{ steps.version.outputs.prerelease == 'false' }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image summary
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          TAG: ${{ steps.version.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Published $IMAGE:$TAG ($DIGEST) for linux/amd64 and linux/arm64" >> "$GITHUB_STEP_SUMMARY"
          if [[ -z "$DOCKERHUB_TOKEN" || -z "$DOCKERHUB_USERNAME" ]]; then
            echo 'Docker Hub skipped: set DOCKERHUB_USERNAME variable and DOCKERHUB_TOKEN secret to enable it.' >> "$GITHUB_STEP_SUMMARY"
          fi
  desktop:
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x64
            target: --win --x64
          - runner: macos-15
            platform: mac-arm64
            target: --mac --arm64
          - runner: macos-15-intel
            platform: mac-x64
            target: --mac --x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download Electron
        run: node node_modules/electron/install.js
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: ''
      - name: Validate version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: node -e 'if (require("./package.json").version !== process.env.TAG.slice(1)) throw new Error("Tag must match package.json version")'
      - run: npm run lint
      - run: npm test
      - name: Build desktop installers
        run: npm run desktop:pack -- ${{ matrix.target }}
      - name: Smoke test packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:KAFKA_BROWSER_SMOKE_DATA_DIR = Join-Path $env:RUNNER_TEMP 'desktop-smoke'
          $app = Start-Process -FilePath 'dist-desktop/win-unpacked/Kafka Browser.exe' -ArgumentList '--smoke-test' -PassThru
          if (-not $app.WaitForExit(90000)) { $app.Kill(); throw 'Desktop smoke test timed out' }
          if ($app.ExitCode -ne 0) { throw "Desktop smoke test failed: $($app.ExitCode)" }
      - name: Smoke test packaged app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          KAFKA_BROWSER_SMOKE_DATA_DIR: ${{ runner.temp }}/desktop-smoke
        run: |
          set -euo pipefail
          app=$(find dist-desktop -path '*/Kafka Browser.app/Contents/MacOS/Kafka Browser' -type f -print -quit)
          test -n "$app"
          "$app" --smoke-test &
          pid=$!
          (sleep 90; kill "$pid" 2>/dev/null) &
          watchdog=$!
          trap 'kill "$watchdog" 2>/dev/null || true' EXIT
          wait "$pid"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            dist-desktop/*.exe
            dist-desktop/*.dmg
            dist-desktop/*.zip
          if-no-files-found: error
  release:
    needs: [publish, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.publish.outputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: installers
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish.outputs.tag }}
          PRERELEASE: ${{ needs.publish.outputs.prerelease }}
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          (cd installers && sha256sum * > SHA256SUMS.txt)
          printf 'Docker image (AMD64 and ARM64):\n\n```sh\ndocker pull %s:%s\n```\n\nImage digest: `%s`\n' "$IMAGE" "$TAG" "$DIGEST" > "$RUNNER_TEMP/notes.md"
          printf '\n## Desktop downloads\n\n' >> "$RUNNER_TEMP/notes.md"
          for file in installers/*.exe installers/*.dmg installers/*.zip; do
            name=$(basename "$file")
            printf -- '- [%s](https://github.com/%s/releases/download/%s/%s)\n' "$name" "$GITHUB_REPOSITORY" "$TAG" "$name" >> "$RUNNER_TEMP/notes.md"
          done
          printf '\nInstallers are currently unsigned. macOS builds are not notarized. See README for signing requirements.\n' >> "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" installers/* --clobber
            exit 0
          fi
          args=(--verify-tag --title "$TAG" --generate-notes --notes-file "$RUNNER_TEMP/notes.md")
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease); fi
          gh release create "$TAG" installers/* "${args[@]}"
