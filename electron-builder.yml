appId: com.alzalabany.kafka-browser
productName: Kafka Browser
directories:
  app: .desktop/app
  output: dist-desktop
files:
  - main.cjs
  - package.json
extraResources:
  - from: .desktop/server
    to: server
  - from: .desktop/runtime
    to: runtime
npmRebuild: false
artifactName: Kafka-Browser-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.developer-tools
  target: [dmg, zip]
  identity: null
win:
  target: [nsis]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
publish: null
